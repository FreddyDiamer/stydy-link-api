name: Hello # имя во вкладке Actions

on: # КОГДА запускать
  push:
    branches: [main]
  workflow_dispatch: # + кнопка ручного запуска

jobs: # ЧТО делать
  hello: # имя job
    runs-on: ubuntu-latest # НА ЧЁМ
    steps:
      - run: uname -m && ls -la # своя shell-команда
      - run: echo "Коммит ${{ github.sha }}"
      - run: echo "Ветка ${{ github.ref }}"
