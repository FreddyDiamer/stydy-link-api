name: Build and Deploy

on:
  push:
    branches: ['main']
    paths-ignore:
      [
        '*.md',
        '.prettierrc',
        '.gitignore',
        'test/**',
        '.vscode/**',
        '.husky/**',
        '.claude/**',
      ]

env:
  IMAGE_NAME: ghcr.io/freddydiamer/study-link-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    # environment: production
    # needs: build
    steps:
      - name: Init ssh credits
        run: |
          mkdir -p ~/.ssh
          cd ~/.ssh
          echo "${{ secrets.SSH }}" > id_ed25519
          echo "$SSH_HOST_TOKEN" > known_hosts
      - run: ls ~/.ssh
      - run: cat ~/.ssh/known_hosts
      - run: docker compose --env-file .env --env-file versions.env up
