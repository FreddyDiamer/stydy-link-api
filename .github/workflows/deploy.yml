name: Build and Deploy

on:
  push:
    branches: ['main']
    paths-ignore:
      [
        '*.md',
        '.prettierrc',
        '.gitignore',
        'test/**',
        '.vscode/**',
        '.husky/**',
        '.claude/**',
      ]
  workflow_dispatch:

jobs:
  env:
    IMAGE_TAG: ghcr.io/freddydiamer/study-link-api:${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Init ssh credits
        run: |
          ls /
          ls .
